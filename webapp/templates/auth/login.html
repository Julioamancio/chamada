{% extends 'base.html' %}
{% block content %}
<div class="row justify-content-center">
  <div class="col-md-5 col-lg-4">
    <div class="card p-4">
      <h3 class="mb-3">Entrar</h3>
      <form method="post">
        <div class="mb-3">
          <label class="form-label">E-mail</label>
          <input class="form-control" type="email" name="email" required>
        </div>
        <div class="mb-3">
          <label class="form-label">Senha</label>
          <div class="input-group">
            <input id="loginPassword" class="form-control" type="password" name="password" required>
            <button class="btn btn-outline-secondary toggle-pass" type="button" aria-label="Mostrar/ocultar senha" data-target="loginPassword">
              <i class="bi bi-eye"></i>
            </button>
          </div>
        </div>
        <button class="btn btn-primary w-100" type="submit">Entrar</button>
      </form>
    </div>
  </div>
</div>
{% endblock %}
