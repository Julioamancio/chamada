<?xml version="1.0" encoding="UTF-8"?>
<!-- Logo padrão: Colégio Santo Antônio (compacta e responsiva) -->
<svg xmlns="http://www.w3.org/2000/svg" width="160" height="40" viewBox="0 0 160 40" role="img" aria-label="Colégio Santo Antônio">
  <!-- Marca geométrica CSA -->
  <g transform="translate(2,2)">
    <rect x="0" y="0" width="56" height="36" rx="6" ry="6" fill="#ffffff" stroke="#e6e6e6"/>
    <!-- Três faixas coloridas que convergem ao centro -->
    <path d="M2,2 H30 L28,20 L2,34 Z" fill="#3b82f6"/>
    <path d="M28,2 H54 L54,34 L28,20 Z" fill="#ef4444"/>
    <path d="M30,2 H28 L28,20 L30,2 Z" fill="#0ea5e9" opacity=".0"/>
    <path d="M28,2 H30 L54,2 L28,20 Z" fill="#f59e0b"/>
    <!-- C, S, A -->
    <circle cx="12" cy="12" r="8" fill="#ffffff" opacity="0.95"/>
    <circle cx="28" cy="12" r="8" fill="#ffffff" opacity="0.9"/>
    <circle cx="44" cy="12" r="8" fill="#ffffff" opacity="0.95"/>
    <text x="12" y="15" text-anchor="middle" font-family="Segoe UI, Roboto, Arial, sans-serif" font-size="10" font-weight="700" fill="#3b82f6">C</text>
    <text x="28" y="15" text-anchor="middle" font-family="Segoe UI, Roboto, Arial, sans-serif" font-size="10" font-weight="700" fill="#f59e0b">S</text>
    <text x="44" y="15" text-anchor="middle" font-family="Segoe UI, Roboto, Arial, sans-serif" font-size="10" font-weight="700" fill="#ef4444">A</text>
  </g>

  <!-- Título ao lado: mantém legível mas não ocupa muito -->
  <text x="64" y="17" font-family="Segoe UI, Roboto, Arial, sans-serif" font-size="12" fill="#111827" font-weight="700">Colégio Santo Antônio</text>
  <text x="64" y="28" font-family="Segoe UI, Roboto, Arial, sans-serif" font-size="9" fill="#6b7280">Chamada Escolar</text>
</svg>
